  ul.cv-list {

    line-height: 1.35;
    margin: 0;
  }

  ul.cv-list > li {
    display: grid;
    grid-template-columns: 150px 26px 1fr;
    align-items: baseline;
    margin: 0 0 0.85em;
    padding: 0;
  }

  ul.cv-list .cv-loc {

  }

  /* 前面的空白靠原始碼換行,這裡只補後面,避免變成兩個空格 */
  ul.cv-list .cv-loc::before { content: "\00b7"; margin-right: 0.35em; }

  /* About 的年份區塊比文章列表密,因為每年只有兩三場 */

  ul.cv-list .cv-side {
    font-size: 0.88em;
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
  }

  ul.cv-list .cv-body {
    grid-column: 3;
    display: block;
  }

  ul.cv-list .cv-note {
    display: block;
    margin: 0.25em 0 0;
    font-size: 0.88em;
    line-height: 1.5;
    opacity: 0.55;
  }

  /* 證照左欄要寬一點(Zero-Point Security) */
  ul.cv-list.certs {
    --rail: 176px;
    --gap: 1.5em;
  }

  ul.cv-list.certs > li {
    grid-template-columns: 168px 26px 1fr;

  }

  /* 證照代號:借用語言 badge 的外框樣式 */
  .cert-badge {
    display: inline-block;
    margin-right: 0.6em;
    padding: 0.05em 0.4em;

  /* 窄螢幕改成上下排 */
  @media (max-width: 720px) {

  /* ---------- 文章列表(日期 + 標題 + 簡介)---------- */

  .year-block { scroll-margin-top: 20px; }

  /* 大字年份 + 往右延伸的細線,當年份分隔 */
  .year-heading {
    display: flex;
    align-items: center;
    gap: 0.65em;

    font-variant-numeric: tabular-nums;
    color: var(--heading-color);
    opacity: 0.32;
  }

  .year-heading::after {
    content: "";
    flex: 1 1 auto;
    height: 1px;
    background: currentColor;
    opacity: 0.45;
  }

  /* ---------- 時間軸(文章列表與 About 共用)----------
     --rail 是垂直線的 x 座標,--gap 是 li 的 margin-bottom,
     兩個都由各清單依自己的欄寬與行距覆寫。 */
  .timeline {
    position: relative;
    margin: 0;
    list-style: none;
    padding: 0;
    --rail: 66px;
    --gap: 1.4em;
  }

  .timeline > li { position: relative; }

  /* 線一段一段接在圓點之間,不是整條畫在 ul 上 --
     整條畫的話最後一筆的線會拖過圓點、垂到項目底部。 */
  .timeline > li:not(:last-child)::after {
    content: "";
    position: absolute;
    left: var(--rail);
    top: calc(0.45em + 13px);
    bottom: calc(3px - var(--gap) - 0.45em);
    width: 1px;
    background: var(--text-color);
    opacity: 0.16;
  }

  .timeline > li::before {
    content: "";
    position: absolute;
    left: calc(var(--rail) - 3px);
    top: 0.45em;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--link-color);
    background: var(--background-color);
    opacity: 0.5;
    transition: opacity 0.15s ease, background-color 0.15s ease;
  }

  .timeline > li:hover::before {
    opacity: 1;
    background: var(--link-color);
  }

  /* 年份標題已交代年,列表只剩月日;中間空一欄讓出時間軸 */

  .year-nav-inline {
