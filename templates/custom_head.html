<style>
  /* ---------- 圖片 ---------- */
  main img {
    display: block;
    margin: 1.6em auto;
    max-width: 100%;
    height: auto;
    border-radius: 4px;
  }

  main figure { margin: 1.6em 0; }
  main figure figcaption {
    text-align: center;
    font-size: 0.85em;
    color: var(--text-color);
    opacity: 0.75;
    margin-top: 0.5em;
  }

  main img[alt^="inline"] {
    display: inline-block;
    margin: 0.5em;
    max-width: 45%;
  }

  /* ---------- 右側浮動目錄 ---------- */
  .toc-float {
    position: fixed;
    top: 100px;
    left: calc(50% + (var(--width) / 2) + 44px);
    width: 280px;
    max-height: 74vh;
    overflow-y: auto;
    font-size: 0.92em;
    line-height: 1.7;
    padding-left: 18px;
    border-left: 1px solid var(--code-background-color);
    scrollbar-width: thin;
  }

  .toc-float .toc-title {
    display: block;
    font-size: 0.72em;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--heading-color);
    opacity: 0.55;
    margin-bottom: 1.1em;
  }

  .toc-float ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }

  /* 第二層:縮排 + 縮小 + 淡一點 */
  .toc-float ul ul {
    padding-left: 14px;
    margin-top: 0.35em;
    margin-bottom: 0.6em;
    font-size: 0.92em;
  }
  .toc-float ul ul a { opacity: 0.78; }

  /* 第一層項目間距大一點 */
  .toc-float > ul > li {
    margin-bottom: 0.75em;
  }
  .toc-float ul ul li {
    margin-bottom: 0.3em;
  }

  .toc-float a {
    display: block;
    color: var(--text-color);
    text-decoration: none;
    padding-left: 12px;
    margin-left: -13px;
    border-left: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .toc-float a:hover {
    color: var(--link-color);
    border-left-color: var(--link-color);
    text-decoration: none;
  }

  /* 捲到哪就標到哪 */
  .toc-float a.active {
    color: var(--link-color);
    border-left-color: var(--link-color);
    font-weight: 600;
  }

  /* 空間不夠就藏起來,改用內嵌版 */
  @media (max-width: 1420px) {
    .toc-float { display: none; }
  }
  @media (min-width: 1421px) {
    .toc-inline { display: none; }
  }

  /* ---------- 左側 metadata rail ---------- */
  .meta-rail {
    display: none;                 /* 預設隱藏,夠寬才開 */
    position: fixed;
    top: 100px;
    right: calc(50% + (var(--width) / 2) + 44px);
    width: 200px;
    text-align: right;             /* 靠右貼齊內文欄 */
    font-size: 0.85em;
    line-height: 1.6;
  }

  .meta-rail .meta-block {
    margin-bottom: 1.6em;
  }

  .meta-rail .meta-label {
    display: block;
    font-size: 0.78em;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--heading-color);
    opacity: 0.45;
    margin-bottom: 0.35em;
  }

  .meta-rail time,
  .meta-rail > .meta-block > span:not(.meta-label) {
    font-variant-numeric: tabular-nums;
    opacity: 0.85;
  }

  .meta-rail a {
    display: block;
    color: var(--text-color);
    opacity: 0.85;
    text-decoration: none;
  }

  .meta-rail a:hover {
    color: var(--link-color);
    opacity: 1;
    text-decoration: underline;
  }

  /* 夠寬才顯示左欄;顯示時把內文裡重複的 metadata 收起來 */
  @media (min-width: 1500px) {
    .meta-rail { display: block; }
    .meta-inline { display: none; }
  }

  h1, h2, h3, h4, h5, h6 { scroll-margin-top: 24px; }

  /* ---------- 演講列表(固定寬度左欄對齊)---------- */
  ul.talks {
    list-style: none;
    padding: 0;
    margin: 1em 0;
  }

  ul.talks li {
    display: flex;
    align-items: baseline;
    margin-bottom: 0.65em;
    line-height: 1.55;
  }

  /* 第一欄:年份+國家 / 發行方 */
  ul.talks li > span {
    flex: 0 0 140px;
    opacity: 0.65;
    font-size: 0.92em;
    font-variant-numeric: tabular-nums;
  }

  /* 第二欄:場次名稱 / 證照代號 */
  ul.talks li > span.venue {
    flex: 0 0 150px;
    opacity: 0.85;
    font-size: 0.95em;
  }

  ul.talks li > span.abbr {
    flex: 0 0 70px;
    opacity: 1;
    font-weight: 700;
    font-size: 0.95em;
  }

  /* 第三欄:標題 */
  ul.talks li > div {
    flex: 1 1 auto;
  }

  /* 證照列表的第一欄要寬一點(Zero-Point Security)。
     用 :first-child 限定,否則會連 .abbr 一起吃到(特異性相同時後者勝)。 */
  ul.talks.certs li > span:first-child {
    flex: 0 0 170px;
  }

  /* 關鍵字副行:縮小、淡化、獨立成行 */
  ul.talks li > div .kw {
    display: block;
    margin-top: 0.2em;
    font-size: 0.85em;
    line-height: 1.5;
    opacity: 0.6;
  }

  /* 證照列表行距鬆一點,副行才不會擠 */
  ul.talks.certs li {
    margin-bottom: 0.95em;
  }

  /* 窄螢幕改成上下排 */
  @media (max-width: 720px) {
    ul.talks li {
      display: block;
      margin-bottom: 1em;
    }
    ul.talks li > span,
    ul.talks.certs li > span {
      display: inline;
      margin-right: 0.5em;
    }
    ul.talks li > span:first-child::after {
      content: "";
    }
    ul.talks li > div {
      margin-top: 0.15em;
    }
  }

  /* ---------- 社群連結 ---------- */
  .social-links {
    margin-top: 0.9em;
    margin-bottom: 0.5em;
    font-size: 0.9em;
  }
  .social-links a { margin: 0 7px; }
</style>
