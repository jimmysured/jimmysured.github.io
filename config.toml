base_url = "https://jimmysured.github.io"
title = "su Jimmy"
description = "Security research notes on Active Directory, identity, and red team."
author = "su Jimmy"

theme = "bearblog"
default_language = "en"

generate_feeds = true
feed_filenames = ["atom.xml"]

compile_sass = false
build_search_index = false

taxonomies = [
  { name = "categories", feed = true },
  { name = "tags", feed = true },
]

[markdown]
highlight_code = true
highlight_theme = "base16-ocean-dark"

[translations]
no_posts = "No posts yet"
remove_filter = "Remove filter"
filtering_for = "Filtering for"
made_with = "Made with"
table_of_contents = "Table of contents"
all_posts = "All posts"
language = "language"
site = "site"

[extra]
date_format = "%Y-%m-%d"
webserver_sends_csp_headers = false
language_switcher = false

# X / Twitter Card 用
twitter_handle = "@jimmysured"

# 沒給 og_image 的文章會用這張(留空就不出圖,X 上會沒有卡片)
# default_og_image = "img/og/default.png"

# 社群連結(顯示在頁尾)
social = [
  { name = "GitHub", url = "https://github.com/jimmysured" },
  { name = "X", url = "https://x.com/jimmysured" },
  { name = "LinkedIn", url = "https://www.linkedin.com/in/jiun-ming-su-828a0419b/" },
]

[extra.table_of_contents]
show = true
max_level = 2
visible_on_load = false

[[extra.main_menu]]
name = "home"
url = "@/_index.md"

[[extra.main_menu]]
name = "blog"
url = "@/blog/_index.md"

[[extra.main_menu]]
name = "about"
url = "@/about.md"
